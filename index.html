<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Us A Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            padding: 40px 30px;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background-color: white;
        }
        textarea {
            height: 120px;
            resize: none;
            border-radius: 20px;
        }
        input:focus, textarea:focus {
            border-color: #7b2ff7;
            outline: 2px solid #d9c2ff;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background-color: #7b2ff7;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5f1fd1;
        }
        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SEND US A MESSAGE</h1>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Full Name" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Phone" required>

            <label for="message">Your Message</label>
            <textarea id="message" placeholder="Your Message" maxlength="500" required></textarea>

            <button type="submit">SEND ✈</button>
        </form>
    </div>

</body>
</html>
